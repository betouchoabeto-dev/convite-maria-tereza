/* Layout: cinematic full-bleed stage. Act 1: a sealed envelope in the dark; Act 2: one parchment scroll over a moonlit castle. Single deliberate night look. */

.photo-pick input[type=file],.attach input{position:absolute;width:1px;height:1px;opacity:0}
.music-pick{display:grid;gap:9px;padding:14px;border:1px dashed rgba(220,181,99,.55);border-radius:10px;background:rgba(220,181,99,.05);transition:background .2s}
.music-pick.drag{background:rgba(220,181,99,.16)}
.music-pick .ml{font-family:var(--f-caps);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.music-pick small{color:rgba(245,233,204,.65);font-size:14px}
#panel .attach{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 16px;border-radius:999px;background:linear-gradient(180deg,#c8213f,var(--rose-deep));border:1px solid #e9b75a;color:#fff3df;font-size:12px;letter-spacing:.14em;cursor:pointer}
#panel .attach:hover{filter:brightness(1.1)}
#panel .attach:focus-within{outline:2px solid var(--gold-hi);outline-offset:3px}
#musName{color:var(--parch);font-weight:600;font-size:15px;word-break:break-word}
.music-pick .b{display:flex;gap:8px;flex-wrap:wrap}
.panel-actions{display:flex;gap:10px;margin-top:6px;position:sticky;bottom:-30px;background:#0f1226;padding-block:12px}
.panel-actions .btn{flex:1;justify-content:center}
.panel-actions .btn.ghost{color:var(--parch)}
#status{min-height:1.4em;margin:6px 0 0;color:var(--gold-hi);font-size:14.5px}
#status.err{color:#ff9aa9}

.sparkles{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden}

function glass(side){

  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  var P=[],cw=5,rh=13,x,y,out="";
  for(y=0;y<=rh;y++){P[y]=[];for(x=0;x<=cw;x++){var edge=x===0||x===cw||y===0||y===rh;P[y][x]=[x*20+(edge?0:(rnd()-.5)*10),y*20+(edge?0:(rnd()-.5)*10)]}}

    [[a,b,c],[a,c,d]].forEach(function(t){out+='<path d="M'+t.map(function(q){return q[0].toFixed(1)+" "+q[1].toFixed(1)}).join("L")+'Z" fill="'+cols[Math.floor(rnd()*cols.length)]+'"/>'})}
  return '<svg class="glass '+side+'" viewBox="0 0 100 260" aria-hidden="true"><defs><clipPath id="arch'+side+'"><path d="M0 260V50a50 50 0 0 1 100 0v210z"/></clipPath></defs><g clip-path="url(#arch'+side+')"><g stroke="#140d08" stroke-width="1.4" opacity=".9">'+out+'</g>'+

   '<path d="M1 260V50a49 49 0 0 1 98 0v210" fill="none" stroke="#c99a3c" stroke-width="3"/></svg>';
}

    var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.84))};im.src=fr.result};fr.readAsDataURL(file)});
}
function buildDoc(c){
  var json=JSON.stringify(c).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+TITLE+'</title>\n'+FONTS+'\n<style id="st">'+$("st").textContent+'</style>\n<div id="root"></div>\n<script type="application/json" id="cfg">'+json+'</scr'+'ipt>\n<script id="app">'+$("app").textContent+'</scr'+'ipt></body></html>';
}
function save(e){
  e.preventDefault();stopPrev();read();
  if(!draft.nome){status("Coloque o nome da aniversariante.",true);return}
  draft.midias=(draft.midias||[]).filter(Boolean).slice(0,3);draft.foto="";draft.foto2="";
  if(!artNs){cfg=draft;closePanel();return}
  var btn=$("save");btn.disabled=true;status("Salvando o convite encantado…");
  artNs.publish(buildDoc(draft)).then(function(){status("Salvo! Recarregando…")}).catch(function(err){
    btn.disabled=false;var c=err&&err.code;
    if(c==="conflict")status("Outra versão foi salva ao mesmo tempo. A página vai recarregar com ela.",true);
    else if(c==="not_writer"||c==="not_granted")status("Você pode ver este convite, mas não editá-lo.",true);
    else if(c==="too_large"||c==="invalid_content")status("As fotos ficaram grandes demais. Tente imagens menores.",true);
    else status("Não foi possível salvar agora ("+(c||"erro")+"). Tente de novo em instantes.",true);
  });
}
var PWH=3972010267058946,unlocked=false;
function pwHash(str){var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;for(i=0;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
$("edit").onclick=function(){
  if(unlocked){openPanel();return}
  var f=$("pw");f.hidden=!f.hidden;if(!f.hidden){$("pwe").textContent="";$("pwi").value="";$("pwi").focus()}
};
$("pw").onsubmit=function(e){e.preventDefault();
  if(pwHash($("pwi").value)===PWH){unlocked=true;$("pw").hidden=true;openPanel()}
  else{$("pwe").textContent="Senha incorreta.";$("pwi").select()}
};
